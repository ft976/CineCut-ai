<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyan-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accent-laser" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="6" />
  
  <!-- Subtle Ambient Glow inside -->
  <circle cx="256" cy="256" r="160" fill="#38bdf8" opacity="0.12" filter="url(#soft-glow)" />
  <circle cx="360" cy="180" r="100" fill="#a855f7" opacity="0.15" filter="url(#soft-glow)" />

  <!-- Outer Film Spool / Reel Border Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#cyan-indigo)" stroke-width="4" stroke-dasharray="14 12" opacity="0.45" />

  <!-- Film Frame Silhouette (Left half / upper cut) -->
  <path d="M140 155 C 140 145, 148 135, 160 135 L 330 135 C 342 135, 352 143, 355 155 L 295 240 L 140 240 Z" fill="#1e293b" stroke="#334155" stroke-width="4" opacity="0.9" />
  <!-- Sprocket holes on top film part -->
  <rect x="165" y="150" width="22" height="30" rx="5" fill="#38bdf8" opacity="0.8" />
  <rect x="210" y="150" width="22" height="30" rx="5" fill="#38bdf8" opacity="0.8" />
  <rect x="255" y="150" width="22" height="30" rx="5" fill="#38bdf8" opacity="0.8" />

  <!-- Film Frame Silhouette (Right/lower cut) -->
  <path d="M157 272 L 217 272 L 372 272 C 384 272, 392 282, 392 294 L 392 357 C 392 369, 382 377, 370 377 L 160 377 C 148 377, 140 369, 140 357 L 140 294 Z" fill="#1e293b" stroke="#334155" stroke-width="4" opacity="0.9" />
  <!-- Sprocket holes on bottom film part -->
  <rect x="235" y="332" width="22" height="30" rx="5" fill="#818cf8" opacity="0.8" />
  <rect x="280" y="332" width="22" height="30" rx="5" fill="#818cf8" opacity="0.8" />
  <rect x="325" y="332" width="22" height="30" rx="5" fill="#818cf8" opacity="0.8" />

  <!-- Diagonal Precision Cut Laser / Blade Angle -->
  <line x1="90" y1="375" x2="422" y2="137" stroke="url(#accent-laser)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
  <line x1="90" y1="375" x2="422" y2="137" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

  <!-- Center Play Glyph (Cutting through) -->
  <polygon points="230,195 325,256 230,317" fill="url(#cyan-indigo)" filter="url(#glow)" />
  <polygon points="235,208 310,256 235,304" fill="#ffffff" opacity="0.9" />

  <!-- AI Sparks / Optical Flare -->
  <path d="M390 120 Q 405 120, 405 105 Q 405 120, 420 120 Q 405 120, 405 135 Q 405 120, 390 120 Z" fill="#38bdf8" />
  <circle cx="405" cy="120" r="4" fill="#ffffff" />

  <path d="M110 395 Q 120 395, 120 385 Q 120 395, 130 395 Q 120 395, 120 405 Q 120 395, 110 395 Z" fill="#ec4899" />
</svg>
